version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-gerenciador
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_tarefas
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: spring-gerenciador
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql-db
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/db_tarefas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql_data: